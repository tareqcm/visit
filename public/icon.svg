<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle inner card -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#ffffff" filter="url(#shadow)" opacity="0.96" />
  
  <!-- Top header bar on card -->
  <path d="M 76 112 C 76 92.1 92.1 76 112 76 L 400 76 C 419.9 76 436 92.1 436 112 L 436 148 L 76 148 Z" fill="#047857" />
  
  <!-- Bank Pillar / Monument symbol inside header -->
  <g fill="#ffffff" transform="translate(196, 88) scale(0.6)">
    <polygon points="100,10 10,40 190,40" />
    <rect x="25" y="45" width="18" height="35" rx="3" />
    <rect x="65" y="45" width="18" height="35" rx="3" />
    <rect x="117" y="45" width="18" height="35" rx="3" />
    <rect x="157" y="45" width="18" height="35" rx="3" />
    <rect x="15" y="82" width="170" height="12" rx="2" />
  </g>
  
  <!-- Document Checklist Lines -->
  <g transform="translate(116, 180)">
    <!-- Row 1 -->
    <rect x="0" y="4" width="28" height="28" rx="6" fill="#10b981" />
    <path d="M 8 18 L 13 23 L 21 11" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="42" y="10" width="160" height="16" rx="4" fill="#0f172a" opacity="0.85" />
    <rect x="216" y="10" width="56" height="16" rx="4" fill="#64748b" opacity="0.4" />

    <!-- Row 2 -->
    <rect x="0" y="52" width="28" height="28" rx="6" fill="#10b981" />
    <path d="M 8 66 L 13 71 L 21 59" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="42" y="58" width="185" height="16" rx="4" fill="#0f172a" opacity="0.85" />
    <rect x="240" y="58" width="32" height="16" rx="4" fill="#64748b" opacity="0.4" />

    <!-- Row 3 -->
    <rect x="0" y="100" width="28" height="28" rx="6" fill="#10b981" />
    <path d="M 8 114 L 13 119 L 21 107" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="42" y="106" width="140" height="16" rx="4" fill="#0f172a" opacity="0.85" />
    <rect x="195" y="106" width="77" height="16" rx="4" fill="#64748b" opacity="0.4" />

    <!-- Photo badge icon in bottom right of card -->
    <g transform="translate(180, 150)">
      <rect x="0" y="0" width="90" height="70" rx="12" fill="#f1f5f9" stroke="#047857" stroke-width="3" />
      <circle cx="28" cy="24" r="8" fill="#f59e0b" />
      <polygon points="12,58 36,36 54,50 68,38 82,58" fill="#047857" />
    </g>
    
    <!-- Stamp Seal -->
    <circle cx="65" cy="180" r="30" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="6,4" />
    <text x="65" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626" font-family="sans-serif">APPROVED</text>
  </g>
</svg>
